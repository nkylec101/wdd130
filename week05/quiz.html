<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <main>
        <div class="header">
            <input type="checkbox" id="title" name="title">
            <h1 for="title">Basic HTML and CSS Quiz</h1>
        </div>
        <form>
            <div>
                <label for="q1">1. What is the acronym of CSS stand for?</label>
                <input type="text" id="q1" name="q1">
            </div>

            <div>
                <label for="q2">2. How are he id and class attributes selected in CSS?</label>
                <textarea id="q2" name="q2"></textarea>
            </div>

            <div>
                <label for="q3">3. Which of the following is a valid CSS comment?</label>
                <select id="q3" name="q3">
                    <option disabled selected>Choose one..</option>
                    <option value="A">A. //this is CSS comment</option>
                    <option value="B">B. /*this is CSS comment*/</option>
                    <option value="C">C. #this is CSS comment</option>
                </select>
            </div>

            <div>
                <label for="q4">
                    4. What is the bottom margin given this declaration?
                    <div class="samplecode">margin: 10px 5px 15px;</div>
                </label>
                <input type="number" id="q4" name="q4">
            </div>

            <div>
                <button type="submit">Submit Quiz</button>
            </div>
    </main>
</body>

</html>
